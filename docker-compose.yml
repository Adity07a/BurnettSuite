services:
  db:
    image: postgres:16-alpine
    container_name: burnettsuite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-burnettsuite}
      POSTGRES_USER: ${POSTGRES_USER:-burnett_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-burnett_secret_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-burnett_user} -d ${POSTGRES_DB:-burnettsuite}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: burnettsuite-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: burnettsuite-backend
    container_name: burnettsuite-backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-burnettsuite-unified-key-2026}
      - DATABASE_URL=postgres://${POSTGRES_USER:-burnett_user}:${POSTGRES_PASSWORD:-burnett_secret_password}@db:5432/${POSTGRES_DB:-burnettsuite}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - AWS_BEDROCK_REGION=${AWS_BEDROCK_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    image: burnettsuite-backend        # reuses the backend image, no build section
    container_name: burnettsuite-celery
    restart: unless-stopped
    command: celery -A config worker -l info
    
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - SECRET_KEY=${SECRET_KEY:-django-insecure-burnettsuite-unified-key-2026}
      - DATABASE_URL=postgres://${POSTGRES_USER:-burnett_user}:${POSTGRES_PASSWORD:-burnett_secret_password}@db:5432/${POSTGRES_DB:-burnettsuite}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - AWS_BEDROCK_REGION=${AWS_BEDROCK_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: burnettsuite-frontend:latest
    container_name: burnettsuite-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
